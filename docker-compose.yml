version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fedinet_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── ML Moderation Microservice ─────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "8090:8090"
    environment:
      API_KEY: ${AI_MODERATION_API_KEY:-changeme}
      PORT: 8090
      FEEDBACK_FILE: /data/feedback.jsonl
    volumes:
      - ml_feedback:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # model download can take time on first run
    restart: unless-stopped

volumes:
  postgres_data:
  ml_feedback:
