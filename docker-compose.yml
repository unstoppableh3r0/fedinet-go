services:
  postgres:
    image: postgres:15-alpine
    container_name: fedinet_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity:
    build:
      context: .
      dockerfile: internal/identity/Dockerfile
    container_name: fedinet_identity
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: adminpass123
      JWT_SECRET: fedinet_test_jwt_secret_2024
      SERVER_URL: http://localhost:8082
      SERVER_ID: server_a

  federation:
    build:
      context: .
      dockerfile: internal/federation/Dockerfile
    container_name: fedinet_federation
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable

volumes:
  postgres_data:
