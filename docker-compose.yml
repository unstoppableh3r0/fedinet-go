version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fedinet_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fedinet_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  # postgres_data holds ALL server-side state:
  #   - user identities, posts, follows, notifications, messages
  #   - trusted-server registry, federation config
  #   - admin dashboard growth-trend snapshots  ← cleared with 'docker-compose down -v'
  #
  # Run 'docker-compose down -v' to wipe every server and reset to a clean slate.
  postgres_data:
