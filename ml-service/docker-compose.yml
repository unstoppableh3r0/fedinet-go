version: "3.9"

services:
  moderation:
    build: .
    ports:
      - "8090:8090"
    environment:
      - API_KEY=${API_KEY:-changeme}
      - PORT=8090
    volumes:
      - ./data:/data          # persist feedback.jsonl on the host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s       # model loading can take a moment
